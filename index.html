<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <title>Footage</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.js"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="mySketch2.js" defer></script>
</head>
<body>
  <main id="canvas-host" aria-label="Footage camera canvas"></main>
  <header>FOOTAGE</header>
  <p id="status" role="status">Tap DRAW to start your camera.</p>
  <nav aria-label="Canvas controls">
    <button id="draw-toggle" type="button" aria-pressed="false">DRAW</button>
    <button id="clear" type="button">CLEAR / RESTART</button>
    <button id="save" type="button">SAVE IMAGE</button>
  </nav>
</body>
</html>
